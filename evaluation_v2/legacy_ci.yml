name: Offline workflow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    # Standard hosted runners are free for public repositories; skip private repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          check-latest: false
      - name: Frozen source and runtime
        run: |
          python -m evaluation.freeze --verify
          python -m governed_analytics doctor
      - name: Units and local integration
        run: python -m unittest discover -s tests -v
      - name: Development comparison
        run: python -m evaluation.run --split development --mode compare --repeat 3 --out work/ci-development
      - name: Authored held-out repeatability
        run: python -m evaluation.run --split heldout --mode compare --repeat 3 --out work/ci-heldout
