name: Offline original and upgrade checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          check-latest: false
      - name: Current upgrade freeze and authored provenance
        run: |
          python -m evaluation_v2.freeze
          python -m evaluation_v2.author --check
          python -m evaluation_v2.legacy --out work/v1-ci
      - name: Pure upgrade checks
        run: python -m unittest tests.unit.test_u2b tests.unit.test_upgrade_budget tests.unit.test_upgrade_gateway tests.unit.test_upgrade_intents tests.unit.test_bigquery_snapshot tests.unit.test_bigquery_loader_deadline -v
      - name: Owned native boundaries and upgrade workflows
        run: python -m unittest tests.integration.test_u2b_native tests.integration.test_upgrade_workflow tests.integration.test_upgrade_transport tests.integration.test_bigquery_native tests.integration.test_bigquery_loader_deadline -v
      - name: Original 48 tasks and tests in unchanged frozen reconstruction
        working-directory: work/v1-ci
        run: |
          python -m evaluation.freeze --verify
          python -m governed_analytics doctor
          python -m unittest discover -s tests -v
          python -m evaluation.run --split development --mode compare --repeat 1 --out work/development
          python -m evaluation.run --split heldout --mode compare --repeat 1 --out work/heldout
      - name: Authored upgrade comparisons (no live model or external service)
        run: |
          python -m evaluation_v2.run --split development --actor compare --out work/ci-u2b-development --lease-ack main-authorized-local-u2b
          python -m evaluation_v2.run --split capability --actor compare --out work/ci-u2b-capability --lease-ack main-authorized-local-u2b
